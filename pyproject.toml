[project]
name = "ai-incident-investigator"
version = "0.1.0"
requires-python = ">=3.13"
description = "Evidence-driven incident investigation — Sunday AI Builds #4"
dependencies = [
    "alembic>=1.20.0",
    "altair>=6.3.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "langchain-core>=1.6.7",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.14",
    "openai>=3.25.0",
    "pandas>=3.0.6",
    "pgvector>=0.5.0",
    "opentelemetry-api>=1.38.0",
    "opentelemetry-sdk>=1.38.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.38.0",
    "opentelemetry-instrumentation-fastapi>=0.59b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.59b0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.3",
    "streamlit>=1.57",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py313"
line-length = 110
extend-exclude = [".venv-build", ".venv", "var"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: requires an explicit isolated TEST_DATABASE_URL"]
